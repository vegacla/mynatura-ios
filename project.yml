name: MyNatura
options:
  bundleIdPrefix: cl.mynatura
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
packages:
  Core:
    path: Packages/Core
  APIClient:
    path: Packages/APIClient
  Persistence:
    path: Packages/Persistence
  Sync:
    path: Packages/Sync
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features
targets:
  MyNatura:
    type: application
    platform: iOS
    sources:
      - path: MyNatura
    dependencies:
      - package: Core
      - package: APIClient
      - package: Persistence
      - package: Sync
      - package: DesignSystem
      - package: Features
    info:
      path: MyNatura/Resources/Info.plist
      properties:
        CFBundleDisplayName: MyNatura
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "MyNatura usa la cámara para escanear códigos de barras, fotografiar boletas de pedidos y reconocer productos."
        NSPhotoLibraryUsageDescription: "MyNatura necesita acceso a tus fotos para elegir la boleta de un pedido."
        NSMicrophoneUsageDescription: "MyNatura usa el micrófono para que puedas dictar pedidos, recepciones y consultas."
        NSSpeechRecognitionUsageDescription: "MyNatura transcribe tu voz para completar pedidos y responder consultas. El audio no se guarda."
        NSLocalNetworkUsageDescription: "MyNatura se conecta al servidor de desarrollo en tu red local."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - cl.mynatura.app.refresh
        # Prellenado del login solo para el build de simulador (Appetize). Vacíos por defecto;
        # CI los llena desde variables/secrets del repo, nunca desde el código.
        MNDevServerURL: $(MN_DEV_SERVER_URL)
        MNDevCustomerCode: $(MN_DEV_CUSTOMER_CODE)
        MNDevPassword: $(MN_DEV_PASSWORD)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.mynatura.app
        PRODUCT_NAME: MyNatura
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
    scheme: {}
