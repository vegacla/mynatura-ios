name: MyNatura
options:
  bundleIdPrefix: cl.mynatura
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
packages:
  Core:
    path: Packages/Core
  Persistence:
    path: Packages/Persistence
  Store:
    path: Packages/Store
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features
  Natura:
    path: Packages/Natura
targets:
  MyNatura:
    type: application
    platform: iOS
    sources:
      - path: MyNatura
    dependencies:
      - package: Core
      - package: Persistence
      - package: Store
      - package: DesignSystem
      - package: Features
      - package: Natura
    info:
      path: MyNatura/Resources/Info.plist
      properties:
        CFBundleDisplayName: MyNatura
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "MyNatura usa la cámara para escanear códigos de barras y reconocer productos."
        NSPhotoLibraryUsageDescription: "MyNatura necesita acceso a tus fotos para elegir la foto de un producto."
        NSFaceIDUsageDescription: "MyNatura usa Face ID para proteger tu contraseña de Natura guardada en este iPhone."
        NSMicrophoneUsageDescription: "MyNatura usa el micrófono para que puedas dictar pedidos, recepciones y consultas."
        NSSpeechRecognitionUsageDescription: "MyNatura transcribe tu voz para completar pedidos y responder consultas. El audio no se guarda."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.mynatura.app
        PRODUCT_NAME: MyNatura
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
    scheme: {}
